<div class="d-flex flex-row gap-2">
    <div class="flex-fill" style="min-width: 0; width: 50%;">
        <form action="{% url 'sales:add-item' %}" method="POST" id="add-item-form">
            {% csrf_token %}
            <div class="d-flex align-items-end gap-2">
                <div class="flex-grow-1">
                    <label class="fs-texto fw-semibold d-block mb-1">CÓDIGO DE BARRAS / SKU / NOME PRODUTO</label>
                    <div class="position-relative">
                        <span class="material-symbols-outlined position-absolute" style="left:10px; top:50%; transform:translateY(-50%); color: var(--cor-fonte-cinza);">barcode_scanner</span>
                        <input type="text" name="{{ form.sku_or_barcode.name }}" class="form-control rounded-pill bg-transparent ps-5 pe-4" placeholder="Pesquisar produto..." autofocus autocomplete="off" id="search-input">
                        <div id="search-results" class="position-absolute w-100 bg-white shadow-lg rounded-3 mt-1 overflow-hidden" style="z-index: 1000; display: none; border: 1px solid var(--border-color);"></div>
                    </div>
                </div>
                <div>
                    <label class="fs-texto fw-semibold d-block mb-2">QTD</label>
                    <input type="number" name="quantity" value="1" min="1" class="form-control text-center rounded-pill bg-transparent" style="width:80px;">
                </div>
                <button type="submit" class="btn botao-verde fw-semibold px-4 py-2">ADICIONAR</button>
            </div>
        </form>
    </div>

    <div class="flex-fill" style="min-width: 0; width: 50%;">
        <div class="h-100 d-flex flex-column justify-content-end">
            <label class="fs-texto fw-semibold d-block mb-1">
                <span class="material-symbols-outlined position-relative me-1" style="top:3px; font-size: 1.2rem;">person</span>IDENTIFICAR CLIENTE
            </label>
            {% if sale.customer %}
                <div class="d-flex justify-content-between align-items-center rounded-pill px-3 py-2 border border-separator">
                    <div>
                        <div class="fw-semibold" style="font-size: 0.85rem;">{{ sale.customer.name }}</div>
                        <small class="text-muted">{{ sale.customer.cpf_cnpj }}</small>
                    </div>
                    <span class="badge bg-success">Vinculado</span>
                </div>
            {% else %}
                <form action="{% url 'sales:identify-customer' %}" method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-2 align-items-end">
                        <div class="flex-grow-1 position-relative">
                            <span class="material-symbols-outlined position-absolute" style="left:10px; top:50%; transform:translateY(-50%); color: var(--cor-fonte-cinza);">badge</span>
                            <input type="text" name="cpf_cnpj" class="form-control rounded-pill bg-transparent ps-5 pe-4" placeholder="CPF ou CNPJ...">
                        </div>
                        <button type="submit" class="btn botao-verde fw-semibold px-4 py-2"><span class="material-symbols-outlined fs-6">person_add</span></button>
                    </div>
                </form>
            {% endif %}
        </div>
    </div>
</div>
