{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<div class="position-relative d-flex justify-content-center align-items-center" style="min-height:75vh;">
    <div class="position-absolute bottom-0 start-0" style="z-index:-1;">
        <img src="{% static 'images/ICONE-GESTHAR.svg' %}" alt="icone gesthar" style="width:550px; opacity:0.9;">
    </div>

    <div class="w-100" style="max-width:900px;">
        <div class="text-center mb-0">
            <img src="{% static 'images/logo_gesthar.svg' %}" alt="logo gesthar" style="max-width:260px;" class="img-fluid mx-auto mb-3">
        </div>
        <div class="card shadow-lg rounded-4 border-0" style="background: rgba(249,250,251,0.85); border-radius:1.5rem; margin-top:-18px;">
            <div class="card-body p-4 text-center">
                <img src="{% static 'images/logo_lg.png' %}" alt="logo linda gestante" style="max-width:180px;" class="img-fluid d-block mx-auto mb-3">
                <div class="mb-3">
                    <i class="bi bi-envelope-check-fill" style="font-size:3rem; color:var(--cor-fonte-rosa);"></i>
                </div>
                <h2 style="color:var(--cor-fonte-rosa); font-weight:700;">E-MAIL ENVIADO!</h2>
                <p class="text-muted mt-2">
                    Um e-mail foi enviado com instruções para redefinir sua senha.<br>
                    Verifique sua caixa de entrada e pasta de spam.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn botao-rosa py-2 fw-semibold mt-3 px-4">
                    VOLTAR AO LOGIN
                </a>
                <div class="text-center mt-4 text-muted small">&copy;Gesthar - {% now "Y" %}</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
